name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair zip
        run: unzip ninjaclient.zip -d projeto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: projeto/ninjaclient
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: projeto/ninjaclient/build/libs/*.jar
