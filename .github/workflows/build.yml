name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair zip
        run: unzip ninjaclient.zip -d projeto

      - name: Corrigir settings.gradle
        run: |
          cat > projeto/ninjaclient/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'ninjaclient'
          EOF

      - name: Corrigir nomes da versao 1.21.11
        run: |
          cd projeto/ninjaclient/src/main/java
          grep -rl "getPos()" . | xargs sed -i \
            -e 's/cam\.getPos()/cam.getCameraPos()/g' \
            -e 's/golem\.getPos()/golem.getEntityPos()/g' \
            -e 's/mc\.player\.getPos()/mc.player.getEntityPos()/g' \
            -e 's/target\.getPos()/target.getEntityPos()/g'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: projeto/ninjaclient
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: projeto/ninjaclient/build/libs/*.jar
